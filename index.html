<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Submit a feature request or enter the Join Kanban board." />
    <link rel="icon" href="./assets/img/logo.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./css/landing.css" />
    <title>Join – Welcome</title>
      <link rel="stylesheet" href="./css/interaction.css">
</head>
  <body class="welcomePage">
    <div class="intro" aria-hidden="true">
      <img class="introLogo" src="./assets/img/Join-white.svg" alt="" />
    </div>
    <header class="welcomeMobileHeader">
      <a href="./index.html" class="welcomeMobileBrand" aria-label="Join welcome page">
        <img src="./assets/img/Join-white.svg" alt="Join" />
      </a>
      <p>Not a Join user? <a href="./signUp.html">Sign up</a></p>
    </header>
    <main class="welcomeMain">
      <section class="welcomeCard" aria-labelledby="welcome-title">
        <h1 id="welcome-title" class="welcomeTitle">Welcome</h1>
        <p class="welcomeText">Pick the option that suits your role: create a request as a stakeholder or log in if you’re part of the team.</p>
        <div class="roleOptions">
          <article class="roleOption">
            <p class="roleText">
              <img class="roleIcon" src="./assets/img/work.svg" alt="" aria-hidden="true" />
              Are you a stakeholder?
            </p>
            <a class="landingButton primaryButton" href="./stakeholder.html">Create request</a>
          </article>
          <article class="roleOption">
            <p class="roleText">
              <img class="roleIcon" src="./assets/img/Frame-245.svg" alt="" aria-hidden="true" />
              Are you a team member?
            </p>
            <a class="landingButton secondaryButton" href="./login.html">Member log in</a>
          </article>
        </div>
      </section>
    </main>
    <footer class="landingFooter darkFooter">
      <a href="./privacyPolicyNoLogin.html">Privacy Policy</a>
      <a href="./legalNoticeNoLogin.html">Legal notice</a>
    </footer>
    <script src="./js/landing.js"></script>
      <template id="renderStakeholderStateTemplate">
        <strong>{{slot0}} of {{slot1}}</strong> requests used today
    </template>
    <script src="./js/htmlTemplates.js"></script>
</body>
</html>
