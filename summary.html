<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="./assets/img/joinDark.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summary</title>
  <link rel="stylesheet" href="./css/navbar.css" />
  <link rel="stylesheet" href="./css/header.css" />
  <link rel="stylesheet" href="./css/summary.css" />
    <link rel="stylesheet" href="./css/interaction.css">
</head>

<body style="visibility: hidden" onload="initializeProtectedPage(summaryInit)">
  <header w3-include-html="./template/header.html"></header>
  <aside>
    <div class="navbar">
      <img class="joinIcon" src="./assets/img/joinWhite.png" alt="Join Icon" />
      <div class="navbarContent">
        <div class="menu">
          <a id="summaryMenu" href="./summary.html" class="summery currentPage">
            <img src="./assets/img/summeryIcon.png" alt="Summary" />
            <p>Summary</p>
          </a>
          <a id="boardMenuResposive" href="./board.html" class="boardResposive">
            <img src="./assets/img/boardIcon.png" alt="Board" />
            <p>Board</p>
          </a>
          <a id="addTaskMenu" href="./addTask.html" class="addTask">
            <img src="./assets/img/addTask.png" alt="Add Task" />
            <p>Add Task</p>
          </a>
          <a id="boardMenu" href="./board.html" class="board">
            <img src="./assets/img/boardIcon.png" alt="Board" />
            <p>Board</p>
          </a>
          <a id="contactsMenu" href="./contacts.html" class="conntacts">
            <img src="./assets/img/contacktsIcon.png" alt="Contacts" />
            <p>Contacts</p>
          </a>
        </div>
        <div class="policy">
          <a id="privacyPolicyMenu" href="./privacyPolicy.html">Privacy Policy</a>
          <a id="legalNoticeMenu" href="./legalNotice.html">Legal notice</a>
        </div>
      </div>
    </div>
  </aside>

  <div class="container">
    <div class="appHeader">
      <p class="appHeaderTitle">Join 360</p>
      <div class="appHeaderSubtitle">
        <img class="horizontalBarBlue" src="./assets/img/horizontalBarBlue.png" alt="Blue bar" />
        <p class="subtitleText">Key Metrics at a Glance</p>
        <span class="blueBorder"></span>
      </div>
    </div>


    <div class="metricsContainer">
      <div class="metricsColumn">
        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="metricCard">
            <div class="metricIconContainer">
              <div class="toDoIcon"></div>
            </div>
            <div class="metricDetails">
              <p id="toDo" class="metricValue">1</p>
              <p class="metricLabel">Triage</p>
            </div>
          </div>
          <div onclick="redirectToBoard('done')" class="metricCard">
            <div class="metricIconContainer">
              <div class="checkIcon"></div>
            </div>
            <div class="metricDetails">
              <p id="done" class="metricValue">1</p>
              <p class="metricLabel">Done</p>
            </div>
          </div>
        </div>
        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="urgentCard">
            <div class="urgentContent">
              <div class="urgentIconContainer">
                <img class="urgentIcon" src="./assets/img/vectorUp.png" alt="Check" />
                <img class="urgentIcon" src="./assets/img/vectorUp.png" alt="Check" />
              </div>
              <div class="metricDetails">
                <p id="urgent" class="metricValue">1</p>
                <p class="metricLabel">Urgent</p>
              </div>

            </div>
            <div class="horizontalBar"></div>
            <div class="deadlineContainer">
              <p id="upcomingDeadline" class="deadlineDate">October 16, 2024</p>
              <p class="deadlineLabel">Upcoming Deadline</p>
            </div>
          </div>
         <div onclick="redirectToBoard()" class="metricCard taskContainer">
            <p id="emailRequests" class="metricValue emailRequestValue" >0</p>
            <p class="metricLabel taskText">Email Requests</p>
          </div>
        </div>

        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="metricCard taskContainer">
            <p id="tasksInBoard" class="metricValue">1</p>
            <p class="metricLabel taskText">Tasks in Board</p>
          </div>
          <div onclick="redirectToBoard('progress');event.stopPropagation()" class="metricCard taskContainer">
            <p id="tasksInProgress" class="metricValue">1</p>
            <p class="metricLabel taskText">Tasks in Progress</p>
          </div>
          <div onclick="redirectToBoard('feedback');event.stopPropagation()" class="metricCard taskContainer">
            <p id="awaitingFeedback" class="metricValue">1</p>
            <p class="metricLabel taskText">Awaiting Feedback</p>
          </div>
        </div>
      </div>
      <div class="animatedImageContainer">
        <div class="greetingContainer">
          <p id="greetingText" class="greetingText"></p>
          <p id="userName" class="userName"></p>
        </div>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="./js/firebase.js"></script>
    <script src="./js/pageAccess.js"></script>
    <script src="./js/summary.js"></script>
    <script src="./js/database.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/taskPersistence.js"></script>
    <script src="./js/template.js"></script>
    <script src="./js/taskTemplates.js"></script>
    <script src="./js/contactTemplates.js"></script>
    <script src="./js/contacts.js"></script>
    <script src="./js/contactPhotos.js"></script>
    <script src="./js/contactList.js"></script>
    <script src="./js/contactEditor.js"></script>
    <template id="contactPhotoPickerHTMLTemplate">
        <button type="button" class="contact-photo-camera" aria-label="Upload profile photo" onclick="document.getElementById('{{slot0}}-contact-photo').click()"></button>
        <input hidden id="{{slot1}}-contact-photo" type="file" accept="image/jpeg,image/png" onchange="selectContactPhoto(this, '{{slot2}}')">
    </template>
    <template id="renderContactPhotoPreviewTemplate">
        <img class="addContactProfilePicture" src="./assets/img/profile_picture.png" alt="">
    </template>
    <template id="createContactDetailsTemplate">
        <h2>{{slot0}}</h2><p class="blueColor">{{slot1}}</p>
    </template>
    <template id="showAddContactTemplate">
        <div id="add-contact-photo-preview"><img class="addContactProfilePicture" src="./assets/img/profile_picture.png" alt=""></div>{{slot0}}
    </template>
    <template id="contactAvatarHTMLTemplate">
        <img class="contact-avatar-photo" src="{{slot0}}" alt="">
    </template>
    <template id="taskTemplate">
        <div class="card" draggable="{{slot0}}" ondragstart="startDragging('{{slot1}}')" data-id="{{slot2}}">
        <div class="cardContent"><span class="labelUser" style="background-color: {{slot3}};">{{slot4}}</span>
        <div class="contextContent"><span class="cardTitle">{{slot5}}</span>
        <div><span class="cardContext">{{slot6}}</span></div>
        {{slot7}}
        <div class="contactContainer"><div style="display:flex;">{{slot8}}</div>
        <div><img class="urgentSymbol" src="{{slot9}}" alt="{{slot10}}"></div>
        </div>
        </div>
        </div>
        </div>
    </template>
    <template id="taskProgressHTMLTemplate">
        <div class="progressbar"><div class="progressbarContainer">
        <div class="bar" id="progressBarId{{slot0}}"></div></div>
        <div class="subtasks">{{slot1}}/{{slot2}} Subtasks</div></div>
    </template>
    <template id="renderEmptyColumnTemplate">
        <div class="noTasks"><span class="noTaskText">{{slot0}}</span></div>
    </template>
    <template id="assignedContactsHTMLTemplate">
        <label class="at-contact-layout">
        <span class="at-contact-name-container">
        <span class="at-contact-shortcut-layout" style="background-color: {{slot0}};">
        <span class="at-contact-shortcut">{{slot1}}</span></span>
        <span class="at-contact-name">{{slot2}}</span></span>
        <span class="at-label-checkbox"><input type="checkbox" data-contact-id="{{slot3}}"
        aria-label="Assign {{slot4}}"
        onchange="updateAssignedContact(this)" data-contact-color="{{slot5}}"
        data-contact-initials="{{slot6}}"><span class="at-checkmark"></span></span>
        </label>
    </template>
    <template id="contactProfileHTMLTemplate">
        <div class="profileName">
        <div class="profilePictureContact" id="pictureViewContact" style="background-color: {{slot0}}">{{slot1}}</div>
        <div class="nameEditBox"><div class="nameBox"><h2>{{slot2}}</h2></div>
        <div class="editDivContact">
        <div class="editBox" role="button" tabindex="0" onkeydown="activateContactControl(event)" id="editDiv" onclick="showEditContact({{slot3}})"><img src="assets/img/edit_contact.png" alt="edit"><p>Edit</p></div>
        <div class="editBox" role="button" tabindex="0" onkeydown="activateContactControl(event)" id="deleteDiv" onclick="deleteContact('/contacts/{{slot4}}')"><img src="assets/img/delete_contact.png" alt=""><p>Delete</p></div>
        </div>
        </div>
        </div>
    </template>
    <template id="contactInformationHTMLTemplate">
        <div class="showOneContact"><div class="showOneContactInfo">
        <h3>Email</h3><a id="emailFromContact" href="mailto:{{slot0}}">{{slot1}}</a>
        </div><div class="showOneContactInfo"><h3>Phone</h3>
        <a id="phoneFromContact" href="tel:{{slot2}}">{{slot3}}</a></div></div>
    </template>
    <template id="responsiveContactTemplate">
        <div onclick="closeEditDiv()">{{slot0}}
        <div class="contactInformation"><p>Contact Information</p></div>
        <div onclick="closeEditDiv()">{{slot1}}</div>
        {{slot2}}</div>
    </template>
    <template id="responsiveContactActionsHTMLTemplate">
        <div onclick="event.stopPropagation(), showEditDiv({{slot0}})" role="button" tabindex="0" aria-label="Contact actions" onkeydown="activateContactControl(event)" id="editContactThirdSection"><img src="./assets/img/points_white.png" alt=""></div>
        <div id="editDivResp" onclick="event.stopPropagation()">
        <div role="button" tabindex="0" onkeydown="activateContactControl(event)" id="editContactResp" onclick="event.stopPropagation(event), showEditContact({{slot1}})"><img src="./assets/img/edit_contact.png" alt=""><p>Edit</p></div>
        <div role="button" tabindex="0" onkeydown="activateContactControl(event)" id="deleteContactResp" onclick="event.stopPropagation(event), deleteContact('/contacts/{{slot2}}'), closeEditResponsive()"><img src="./assets/img/delete_contact.png" alt=""><p>Delete</p></div>
        </div>
    </template>
    <template id="editContactTemplate">
        <div id="closeAddContactDiv"><img onclick="cancelEditContact()" id="addNewContactCloseButton" src="/assets/img/Close.png" alt="close"></div>
        <div class="profileDivContact"><div id="editProfilePicture"><div id="whiteCircle"><div id="initialsEditContact"><div id="edit-contact-photo-preview"></div></div></div>{{slot0}}</div>
        <div id="contactInput">{{slot1}}
        <div id="addNewContactAlert" class="contact-save-error" role="alert" hidden></div><div id="btnDiv">
        <button onclick="cancelEditContact(); deleteDataContact('/contacts/{{slot2}}')" id="cancelButtonContact">Delete<img id="cancelIcon" src="./assets/img/cancel(x).png" alt=""></button>
        <button onclick="editContactToArray({{slot3}})" id="editContactButton">Save<img src="./assets/img/check.png" alt=""></button>
        </div>
        </div>
        </div>
    </template>
    <template id="editContactInputsHTMLTemplate">
        <div id="inputDiv"><div class="contact-field"><div id="inputBox" class="inputBox">
        <input class="inputBlueBorder" id="editName" required type="text" placeholder="Name"><img src="/assets/img/person.png"></div><p id="editName-error" class="contact-field-error" role="alert" hidden></p></div>
        <div class="contact-field"><div class="inputBox"><input id="editEmail" type="email" required placeholder="Email"><img src="/assets/img/mail.png"></div><p id="editEmail-error" class="contact-field-error" role="alert" hidden></p></div>
        <div class="contact-field"><div class="inputBox"><input id="editPhone" type="tel" inputmode="tel" required placeholder="Phone"><img src="/assets/img/call.png"></div><p id="editPhone-error" class="contact-field-error" role="alert" hidden></p></div></div>
    </template>
    <template id="editTaskShellHTMLTemplate">
        <section id="edit-task-overlay{{slot0}}" class="edit-task-overlay d-none">
        <div class="edit-close-btn-container"><h2 class="task-edit-heading">Edit Task</h2><button type="button" class="task-icon-button" aria-label="Close edit task" onclick="off()"><img class="closeButton" src="./assets/img/Close.png" alt=""></button></div>
        <form onsubmit="event.preventDefault(); saveTaskChanges('{{slot1}}')" novalidate id="edit-main-input-container{{slot2}}" class="main-input-container join-task-form" w3-include-html="template/addTaskTemplate.html"></form>
        <div class="edit-btn-position-container"><button type="submit" form="edit-main-input-container{{slot3}}" class="board-task-edit-btn"><span>Ok</span><img src="assets/img/check(ok).png" alt=""></button></div>
        </section>
    </template>
    <template id="taskOverlayHeaderHTMLTemplate">
        <section class="overlayUserTitle"><div class="overlayMeta">
        <span style="background-color: {{slot0}};" class="overlayUser">{{slot1}}</span>{{slot2}}
        </div><button type="button" class="task-icon-button" aria-label="Close task details" onclick="off()"><img class="closeButton" src="./assets/img/Close.png" alt=""></button></section>
        <section><h2 class="overlayTitle">{{slot3}}</h2></section>
    </template>
    <template id="taskOverlayDetailsHTMLTemplate">
        <section class="overlayContext"><span>{{slot0}}</span></section>
        <section class="creatorSection"><span class="dueDate">Creator:</span>{{slot1}}
        <span class="creatorName">{{slot2}}</span>{{slot3}}</section>
        <section class="dateDiv"><span class="dueDate">Due date:</span><span class="date">{{slot4}}</span></section>
        <section class="prioDiv"><span class="dueDate">Priority:</span><span class="urgencyText">{{slot5}}
        <img class="overlayUrgencyImg" src="{{slot6}}" alt="{{slot7}}"></span></section>
        <section><span class="contactOverlay">Assigned To:</span>{{slot8}}</section>
        <div class="attachmentsOverlay"><span>Attachments</span>{{slot9}}</div>
        {{slot10}}
    </template>
    <template id="taskAttachmentsHTMLTemplate">
        <div class="task-overlay-attachments">{{slot0}}</div>
    </template>
    <template id="creatorBadgeHTMLTemplate">
        <span class="creatorBadge creatorBadgeExternal"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Extern</span>
    </template>
    <template id="creatorBadgeHTMLTemplate2">
        <span class="creatorBadge creatorBadgeMember"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-4 2.5-6 6-6s6 2 6 6M15 14c3-.5 5 1.5 5 4.5"/></svg>{{slot0}}</span>
    </template>
    <template id="creatorActionHTMLTemplate">
        <a class="creatorAction" href="mailto:{{slot0}}" aria-label="Send email to {{slot1}}"><svg class="creatorActionIcon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="15" height="11" rx="1"/><path d="m4 7 6.5 5L17 7M19 14v5m-2-2h4"/></svg>E-mail</a>
    </template>
    <template id="creatorActionHTMLTemplate2">
        <a class="creatorAction" href="./contacts.html?email={{slot0}}" aria-label="Open profile of {{slot1}}"><svg class="creatorActionIcon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c0-4.5 2.5-7 7-7s7 2.5 7 7z"/></svg>Profil</a>
    </template>
    <template id="aiBadgeHTMLTemplate">
        <img class="aiGeneratedHint" src="./assets/img/Note_KI generiert.svg" alt="AI-generated ticket">
    </template>
    <template id="taskActionsHTMLTemplate">
        <section class="taskActions"><div id="editDiv" class="editDiv">
        <button type="button" class="deleteDiv" onclick="deleteTask('{{slot0}}'); off();"><img class="deletePng" src="./assets/img/delete (1).png" alt=""><span>Delete</span></button>
        <div class="vector"></div><button type="button" class="deleteDiv" onclick="showEditOverlay('{{slot1}}')">
        <img class="deletePng" src="./assets/img/edit (1).png" alt=""><span>Edit</span></button>
        </div></section>
    </template>
    <template id="TaskOverlayDetailsHTMLItemTemplate">
        <div class="subtasksOverlay"><span>Subtasks</span></div>{{slot0}}
    </template>
    <template id="TaskAttachmentsHTMLItemTemplate">
        <div class="task-overlay-attachment"><button type="button" class="attachment-open" onclick="openImageViewer({{slot0}})" aria-label="Open {{slot1}}"><img src="{{slot2}}" alt=""><span>{{slot3}}</span></button><button type="button" class="attachment-download-icon" onclick="downloadAttachment({{slot4}}, event)" aria-label="Download {{slot5}}"></button></div>
    </template>
    <script src="./js/htmlTemplates.js"></script>
</body>

</html>
