<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="./assets/img/joinDark.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summary</title>
  <link rel="stylesheet" href="./css/navbar.css" />
  <link rel="stylesheet" href="./css/header.css" />
  <link rel="stylesheet" href="./css/summary.css" />
    <link rel="stylesheet" href="./css/interaction.css">
</head>

<body style="visibility: hidden" onload="initializeProtectedPage(summaryInit)">
  <header w3-include-html="./template/header.html"></header>
  <aside>
    <div class="navbar">
      <img class="joinIcon" src="./assets/img/Join-white.svg" alt="Join Icon" />
      <div class="navbarContent">
        <div class="menu">
          <a id="summaryMenu" href="./summary.html" class="summery currentPage">
            <img src="./assets/img/summeryIcon.png" alt="Summary" />
            <p>Summary</p>
          </a>
          <a id="boardMenuResposive" href="./board.html" class="boardResposive">
            <img src="./assets/img/boardIcon.png" alt="Board" />
            <p>Board</p>
          </a>
          <a id="addTaskMenu" href="./addTask.html" class="addTask">
            <img src="./assets/img/addTask.png" alt="Add Task" />
            <p>Add Task</p>
          </a>
          <a id="boardMenu" href="./board.html" class="board">
            <img src="./assets/img/boardIcon.png" alt="Board" />
            <p>Board</p>
          </a>
          <a id="contactsMenu" href="./contacts.html" class="conntacts">
            <img src="./assets/img/contacktsIcon.png" alt="Contacts" />
            <p>Contacts</p>
          </a>
        </div>
        <div class="policy">
          <a id="privacyPolicyMenu" href="./privacyPolicy.html">Privacy Policy</a>
          <a id="legalNoticeMenu" href="./legalNotice.html">Legal notice</a>
        </div>
      </div>
    </div>
  </aside>

  <div class="container">
    <div class="appHeader">
      <p class="appHeaderTitle">Join 360</p>
      <div class="appHeaderSubtitle">
        <img class="horizontalBarBlue" src="./assets/img/horizontalBarBlue.png" alt="Blue bar" />
        <p class="subtitleText">Key Metrics at a Glance</p>
        <span class="blueBorder"></span>
      </div>
    </div>


    <div class="metricsContainer">
      <div class="metricsColumn">
        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="metricCard">
            <div class="metricIconContainer">
              <div class="toDoIcon"></div>
            </div>
            <div class="metricDetails">
              <p id="toDo" class="metricValue">1</p>
              <p class="metricLabel">Triage</p>
            </div>
          </div>
          <div onclick="redirectToBoard('done')" class="metricCard">
            <div class="metricIconContainer">
              <div class="checkIcon"></div>
            </div>
            <div class="metricDetails">
              <p id="done" class="metricValue">1</p>
              <p class="metricLabel">Done</p>
            </div>
          </div>
        </div>
        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="urgentCard">
            <div class="urgentContent">
              <div class="urgentIconContainer">
                <img class="urgentIcon" src="./assets/img/vectorUp.png" alt="Check" />
                <img class="urgentIcon" src="./assets/img/vectorUp.png" alt="Check" />
              </div>
              <div class="metricDetails">
                <p id="urgent" class="metricValue">1</p>
                <p class="metricLabel">Urgent</p>
              </div>

            </div>
            <div class="horizontalBar"></div>
            <div class="deadlineContainer">
              <p id="upcomingDeadline" class="deadlineDate">October 16, 2024</p>
              <p class="deadlineLabel">Upcoming Deadline</p>
            </div>
          </div>
         <div onclick="redirectToBoard()" class="metricCard taskContainer">
            <p id="emailRequests" class="metricValue emailRequestValue" >0</p>
            <p class="metricLabel taskText">Email Requests</p>
          </div>
        </div>

        <div class="metricsRow">
          <div onclick="redirectToBoard()" class="metricCard taskContainer">
            <p id="tasksInBoard" class="metricValue">1</p>
            <p class="metricLabel taskText">Tasks in Board</p>
          </div>
          <div onclick="redirectToBoard('progress');event.stopPropagation()" class="metricCard taskContainer">
            <p id="tasksInProgress" class="metricValue">1</p>
            <p class="metricLabel taskText">Tasks in Progress</p>
          </div>
          <div onclick="redirectToBoard('feedback');event.stopPropagation()" class="metricCard taskContainer">
            <p id="awaitingFeedback" class="metricValue">1</p>
            <p class="metricLabel taskText">Awaiting Feedback</p>
          </div>
        </div>
      </div>
      <div class="animatedImageContainer">
        <div class="greetingContainer">
          <p id="greetingText" class="greetingText"></p>
          <p id="userName" class="userName"></p>
        </div>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="./js/firebase.js"></script>
    <script src="./js/pageAccess.js"></script>
    <script src="./js/summary.js"></script>
    <script src="./js/database.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/taskPersistence.js"></script>
    <script src="./js/template.js"></script>
    <script src="./js/taskTemplates.js"></script>
    <script src="./js/contactTemplates.js"></script>
    <script src="./js/contacts.js"></script>
    <script src="./js/contactPhotos.js"></script>
    <script src="./js/contactList.js"></script>
    <script src="./js/contactEditor.js"></script>
    <script src="./js/htmlTemplates.js"></script>
</body>

</html>
