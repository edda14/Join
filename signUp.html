<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/img/Join-white.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./css/signUp.css" />
    <title>Join – Sign up</title>
      <link rel="stylesheet" href="./css/interaction.css">
</head>
  <body>
    <img class="joinIcon" src="./assets/img/logo.svg" alt="Join Icon" />
    <div class="justifySignUpContainer">
      <div class="signUpContainer">
        <div class="vectorLeft">
          <img
            src="./assets/img/arrow-left-line.svg"
            alt="Arrow back"
            onclick="redirectToLogIn()"
          />
        </div>
        <div class="signUptTextContainer">
          <h2 class="signUptText">Sign up</h2>
        </div>
        <form action="" novalidate onsubmit="return addUser(event)">
          <div class="signUpInput">
            <input
              onblur="toUpperCase(this)"
              id="signUpNameInput"
              aria-describedby="signUpFeedback"
              maxlength="80"
              class="nameInput"
              type="text"
              placeholder="Name"
              required
            />
            <input
              id="signUpEmailInput"
              aria-describedby="signUpFeedback"
              maxlength="254"
              class="emailInput"
              type="email"
              placeholder="Email"
              required
            />
            <div class="passwordContainer">
              <input
                onblur="handlePasswordImage(this)"
                onfocus="handlePasswordStyle(this)"
                id="signUpPasswordInput"
                aria-describedby="signUpFeedback"
                maxlength="128"
                class="passwordInput passwordInputImg"
                type="password"
                placeholder="Password"
                required
              />
              <span
                class="paswordVisibilityBTN"
                onclick="handlePasswordVisibility()"
              ></span>
            </div>
            <div class="passwordContainer">
              <input
                onblur="handleConfirmPasswordImage(this)"
                onfocus="handleConfirmPasswordStyle(this)"
                id="confirmPasswordInput"
                aria-describedby="signUpFeedback"
                maxlength="128"
                class="confirmPasswordInput passwordInputImg"
                type="password"
                placeholder="Confirm Password"
                required
              />
              <span
                class="confirmPaswordVisibilityBTN"
                onclick="handleConfirmPasswordVisibility()"
              ></span>
            </div>
            <span id="signUpFeedback" class="signUpFeedback" aria-live="polite"></span>
            <div class="acceptCheckbox">
              <div class="checkboxContainer">
                <img
                  id="checkbox"
                  class="checkbox"
                  src="./assets/img/emptyCheckbox.png"
                  alt="Checkbox"
                  onclick="toggleCheckbox(this)"
                />
                <img
                  id="checkmark"
                  src="./assets/img/okBlack.png"
                  alt="check"
                  style="display: none"
                />
              </div>
              <p class="checkmarkText">
                I accept the
                <a
                  class="privacyPolicy"
                  href="./privacyPolicyNoLogin.html"
                  target="_blank"
                  >Privacy Policy</a
                >
              </p>
            </div>
            <button type="submit" class="signUp">Sign up</button>
          </div>
        </form>
      </div>
    </div>
    <div id="signUpPopupContainer" class="signUpPopupContainer"></div>
    <div id="signUpPopup" class="signUpPopup">
      <p>You Signed Up successfully</p>
    </div>
    <footer>
      <a href="./privacyPolicyNoLogin.html" target="_blank">Privacy Policy</a>
      <a href="./legalNoticeNoLogin.html" target="_blank">Legal notice</a>
    </footer>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="./js/firebase.js"></script>
    <script src="./js/database.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/taskPersistence.js"></script>
    <script src="./js/signUp.js?v=20260925-name-spaces"></script>
    <script src="./js/htmlTemplates.js"></script>
</body>
</html>
